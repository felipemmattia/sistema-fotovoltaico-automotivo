# ==============================================================================
# ESPHome Telemetry System for Epever XTRA 2210N MPPT Solar Charge Controller
# Target Hardware: Waveshare ESP32-S3 RS485/CAN Board
# Protocol: Modbus RTU over RS485 (Half-Duplex)
# Feature Set: High-reliability reading, clamping & sanitization filters,
#              offline timeout detection, HTTP Webhook transmission to dashboard.
# ==============================================================================

esphome:
  name: epever-solar-esp32s3
  friendly_name: "Epever Solar ESP32-S3 Telemetry"
  comment: "Production telematics bridge for Epever XTRA 2210N MPPT Controller"
  project:
    name: "automotive.solar_mppt_telemetry"
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino


# Wi-Fi Configuration with auto-reconnect & Fallback Access Point
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  
  # Fallback AP when WiFi network is disconnected/out of range on the road
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password

  # Automatic Wi-Fi reconnection handling
  reboot_timeout: 15min

# Local captive portal for network provisioning
captive_portal:

# GPIO21 is dedicated to RS485 Direction Enable (DE/RE) on Waveshare ESP32-S3-RS485-CAN

# ESPHome Native API & Web Server for local diagnostics
api:
  encryption:
    key: "cIyaOHMRxVnQxDObgm80O+Vv5osviRlUluv1wyndiok="

web_server:
  port: 80

logger:
  level: INFO
  hardware_uart: USB_CDC

# Network time synchronization for accurate timestamping
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Sao_Paulo"

# HTTP Request client for pushing JSON telemetry payloads to Online Dashboard
http_request:
  useragent: "ESP32S3-Epever-Telemetry/1.0"
  timeout: 10s
  id: http_client

# ==============================================================================
# HARDWARE UART & RS485 BUS CONFIGURATION (Waveshare ESP32-S3-RS485-CAN)
# Pinagem oficial Waveshare: TX=GPIO17, RX=GPIO18, EN(DE/RE)=GPIO21
# ==============================================================================
uart:
  - id: uart_modbus
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200  # Epever XTRA 2210N factory default Modbus RTU baud rate (115200 8N1)
    stop_bits: 1
    data_bits: 8
    parity: NONE
    flow_control_pin: GPIO21  # Waveshare RS485 Direction Enable (DE/RE) pin under UART

# Modbus RTU Protocol Controller Definition
modbus:
  - id: modbus_bus
    uart_id: uart_modbus
    turnaround_time: 20ms    # Time between Modbus requests

modbus_controller:
  - id: epever_mppt
    modbus_id: modbus_bus
    address: 0x01
    setup_priority: -10
    update_interval: 1s

# ==============================================================================
# MODBUS INPUT REGISTERS READ & DATA SANITIZATION FILTERS
# Epever XTRA 2210N Input Registers (Function Code 0x04)
# ==============================================================================
sensor:
  # ----------------------------------------------------------------------------
  # 1. SOLAR PV INPUT PARAMETERS
  # ----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Tensão de Entrada FV (Painel)"
    id: pv_voltage
    register_type: read
    address: 0x3100
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 120.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Corrente de Entrada FV (Painel)"
    id: pv_current
    register_type: read
    address: 0x3101
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 30.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Potência de Entrada FV (Painel)"
    id: pv_power
    register_type: read
    address: 0x3102
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    value_type: U_DWORD_R
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 1000.0
      - filter_out: nan
    on_value:
      then:
        # Update peak power tracker if current PV power exceeds recorded peak
        - lambda: |-
            if (isnan(id(peak_pv_power).state) || x > id(peak_pv_power).state) {
              id(peak_pv_power).publish_state(x);
            }

  # Peak Power Tracker (Stored locally in template sensor)
  - platform: template
    name: "Potência de Pico FV Registrada"
    id: peak_pv_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: never

  # ----------------------------------------------------------------------------
  # 2. BATTERY & CHARGING PARAMETERS
  # ----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Tensão de Carga Bateria"
    id: battery_voltage
    register_type: read
    address: 0x3104
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 36.0
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            id(last_successful_read_timestamp) = id(sntp_time).now().timestamp;
            id(controller_offline_flag).publish_state(false);

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Corrente de Carga Bateria"
    id: battery_current
    register_type: read
    address: 0x3105
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 30.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Potência de Saída (Carga Bateria)"
    id: battery_power
    register_type: read
    address: 0x3106
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    value_type: U_DWORD_R
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 1000.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Estado de Carga Bateria (SOC)"
    id: battery_soc
    register_type: read
    address: 0x311A  # Epever Protocol: 0x311A is Battery SoC (0-100%)
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - clamp:
          min_value: 0
          max_value: 100
      - filter_out: nan

  # ----------------------------------------------------------------------------
  # 3. TEMPERATURE SENSOR (EXTERNAL BATTERY NTC SENSOR)
  # ----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Temperatura da Bateria (Sensor Externo)"
    id: external_temp
    register_type: read
    address: 0x3110  # Epever Protocol: 0x3110 is Battery Temperature (°C x 100)
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      - clamp:
          min_value: -40.0
          max_value: 85.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Temperatura Remota RTS Bateria"
    id: controller_temp
    register_type: read
    address: 0x311B  # Epever Protocol: 0x311B is Remote Battery Temperature (°C x 100)
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      - clamp:
          min_value: -40.0
          max_value: 85.0
      - filter_out: nan

  # ----------------------------------------------------------------------------
  # 4. ENERGY GENERATION METRICS (STATISTICS)
  # ----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Energia Gerada Hoje"
    id: energy_today
    register_type: read
    address: 0x330C
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD_R
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Energia Gerada Acumulada Total"
    id: energy_total
    register_type: read
    address: 0x3312
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD_R
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
      - filter_out: nan

  # WiFi Signal RSSI for adaptive proximity rate
  - platform: wifi_signal
    name: "WiFi Signal RSSI"
    id: wifi_rssi_sensor
    update_interval: 1s

  # ----------------------------------------------------------------------------
  # 5. CONTROLLER STATUS & FAULT DIAGNOSTIC REGISTERS
  #    0x3200: Battery Status (Overvolt, Undervolt, Over-temp, Low-temp, Sys Volt)
  #    0x3201: Charging Equipment Status (PV Volt, MOSFET short, Overcurrent, Stage)
  #    0x3202: Discharging Equipment Status (Output Short, Overcurrent, Boost Fault)
  # ----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Registrador de Status da Bateria (0x3200)"
    id: battery_status_reg
    register_type: read
    address: 0x3200
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Registrador de Status do Carregador (0x3201)"
    id: charging_status_reg
    register_type: read
    address: 0x3201
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - filter_out: nan

  - platform: modbus_controller
    modbus_controller_id: epever_mppt
    name: "Registrador de Status da Descarga (0x3202)"
    id: discharging_status_reg
    register_type: read
    address: 0x3202
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - filter_out: nan

# ==============================================================================
# BINARY SENSORS & OFFLINE DETECTION LOGIC
# Requirement: Offline status detection based on communication timeout (3 mins)
# ==============================================================================
binary_sensor:
  # Direct Modbus communication health status
  - platform: template
    name: "Controladora Modbus Conectada"
    id: modbus_online_status
    device_class: connectivity
    lambda: |-
      return !id(controller_offline_flag).state;

  # Timeout flag: Becomes TRUE if no modbus packet received for 180s (3 minutes)
  - platform: template
    name: "Status Controladora Offline"
    id: controller_offline_flag
    device_class: problem


globals:
  - id: last_successful_read_timestamp
    type: long
    restore_value: false
    initial_value: '0'
  - id: telemetry_payload
    type: std::string
    restore_value: false
    initial_value: '"{}"'
  - id: target_interval_ms
    type: int
    restore_value: false
    initial_value: '10000'
  - id: last_send_millis
    type: uint32_t
    restore_value: false
    initial_value: '0'

interval:
  - interval: 1s
    then:
      - lambda: |-
          // 0. Dynamic Interval Check: only send when target_interval_ms has elapsed
          uint32_t now_ms = millis();
          if (id(last_send_millis) > 0 && (now_ms - id(last_send_millis) + 100) < (uint32_t)id(target_interval_ms)) {
            id(telemetry_payload) = "";
            return;
          }

          // 1. Check Modbus timeout (3 minutes = 180 seconds)
          long current_ts = id(sntp_time).now().timestamp;
          if (id(last_successful_read_timestamp) > 0 && (current_ts - id(last_successful_read_timestamp)) > 180) {
            id(controller_offline_flag).publish_state(true);
            ESP_LOGW("EPEVER_TELEMETRY", "TIMEOUT: Controladora sem resposta por mais de 3 minutos!");
          }

          // 2. Validate sensor reads before constructing telemetry packet
          if (std::isnan(id(pv_voltage).state) || std::isnan(id(battery_voltage).state)) {
            ESP_LOGW("EPEVER_TELEMETRY", "Leituras invalidas (NaN). Abortando envio.");
            id(telemetry_payload) = "";
            return;
          }

          // 3. Measure WiFi Signal Strength (RSSI) to estimate proximity
          int rssi = -100;
          if (!std::isnan(id(wifi_rssi_sensor).state)) {
            rssi = (int)id(wifi_rssi_sensor).state;
          }

          // 3b. Read Epever Diagnostic Status Registers (0x3200, 0x3201, 0x3202)
          uint16_t bat_stat = std::isnan(id(battery_status_reg).state) ? 0 : (uint16_t)id(battery_status_reg).state;
          uint16_t chg_stat = std::isnan(id(charging_status_reg).state) ? 0 : (uint16_t)id(charging_status_reg).state;
          uint16_t dis_stat = std::isnan(id(discharging_status_reg).state) ? 0 : (uint16_t)id(discharging_status_reg).state;

          // 4. Build JSON Payload into global string
          std::string is_online = id(controller_offline_flag).state ? "false" : "true";
          char buf[720];
          snprintf(buf, sizeof(buf),
            "{"
              "\"device_id\":\"ESP32S3_EPEVER_01\","
              "\"online\":%s,"
              "\"pv_voltage\":%.2f,"
              "\"pv_current\":%.2f,"
              "\"pv_power\":%.2f,"
              "\"battery_voltage\":%.2f,"
              "\"battery_current\":%.2f,"
              "\"battery_power\":%.2f,"
              "\"battery_soc\":%.0f,"
              "\"external_temp\":%.1f,"
              "\"controller_temp\":%.1f,"
              "\"peak_pv_power\":%.2f,"
              "\"energy_today\":%.2f,"
              "\"energy_total\":%.2f,"
              "\"wifi_rssi\":%d,"
              "\"battery_status\":%u,"
              "\"charging_status\":%u,"
              "\"discharging_status\":%u"
            "}",
            is_online.c_str(),
            id(pv_voltage).state,
            id(pv_current).state,
            id(pv_power).state,
            id(battery_voltage).state,
            id(battery_current).state,
            id(battery_power).state,
            id(battery_soc).state,
            id(external_temp).state,
            id(controller_temp).state,
            id(peak_pv_power).state,
            id(energy_today).state,
            id(energy_total).state,
            rssi,
            (unsigned int)bat_stat,
            (unsigned int)chg_stat,
            (unsigned int)dis_stat
          );
          id(telemetry_payload) = std::string(buf);
          id(last_send_millis) = now_ms;
          ESP_LOGD("EPEVER_TELEMETRY", "Payload: %s", buf);

      # Step 5: HTTP POST with capture_response to receive adaptive interval from Dashboard
      - if:
          condition:
            lambda: 'return !id(telemetry_payload).empty();'
          then:
            - http_request.post:
                url: !secret dashboard_webhook_url
                request_headers:
                  Content-Type: application/json
                  X-Api-Key: !secret telemetry_api_key
                body: !lambda 'return id(telemetry_payload);'
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200 || response->status_code == 201) {
                          // Search for "next_interval_ms":<number> in response body
                          size_t pos = body.find("\"next_interval_ms\":");
                          if (pos != std::string::npos) {
                            int next_ms = atoi(body.c_str() + pos + 19);
                            if (next_ms >= 1000 && next_ms <= 60000) {
                              id(target_interval_ms) = next_ms;
                              ESP_LOGI("EPEVER_TELEMETRY", "Intervalo adaptativo atualizado para: %d ms", next_ms);
                            }
                          }
                        }

# Manual Reset button for peak power counter
button:
  - platform: template
    name: "Zerar Potência de Pico FV"
    id: reset_peak_power
    on_press:
      then:
        - lambda: |-
            id(peak_pv_power).publish_state(0.0);
            ESP_LOGI("EPEVER_TELEMETRY", "Potência de pico zerada manualmente.");
